name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Token gate - raw colours stay in the palette
        run: |
          hits=$(grep -rn --include='*.kt' -E 'Color\(0x' app core feature | grep -v '/theme/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "Raw Color(0x...) literals must live in core/designsystem/theme/Palette.kt"
            exit 1
          fi

      - name: Verify bundled dictionary
        run: python3 tools/verify_dict.py

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee assemble.log

      - name: Surface build errors
        if: failure()
        run: |
          grep -E '^e: |What went wrong|FAILURE:' assemble.log | head -60 | while IFS= read -r line; do
            printf '::error title=Gradle::%s\n' "$line"
          done

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest :core:common:test :core:domain:test

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Surface lint failures
        if: failure()
        run: |
          for report in $(find . -path '*/build/reports/lint-results-*.xml'); do
            python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for issue in root.findall('issue'):
              if issue.get('severity') != 'Error':
                  continue
              loc = issue.find('location')
              path = loc.get('file', '') if loc is not None else ''
              line = loc.get('line', '') if loc is not None else ''
              msg = (issue.get('message') or '').replace('\n', ' ')
              print(f"::error file={path},line={line},title={issue.get('id')}::{msg}")
          PY
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reelvocab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore
